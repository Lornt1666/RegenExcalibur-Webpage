name: Public AI checklist source and Pages smoke

on:
  pull_request:
    paths:
      - "atb-feature-checklist/index.html"
      - ".github/workflows/atb-feature-checklist-smoke.yml"
  push:
    branches:
      - RegenExcalibur-Webpage
      - work/atb-pages-public-smoke-2026-11-22
    paths:
      - "atb-feature-checklist/index.html"
      - ".github/workflows/atb-feature-checklist-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atb-checklist-smoke
  cancel-in-progress: true

jobs:
  static-check:
    name: Validate published form source without sending
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Confirm safe form structure and source scope
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.choices = []
                  self.form = []
                  self.required_consent = False
                  self.has_captcha = False
                  self.submit_button = False
              def handle_starttag(self, tag, pairs):
                  d=dict(pairs)
                  if tag=="form" and d.get("id")=="feature-form": self.form.append(d)
                  if tag=="input":
                      if "feature-input" in d.get("class","").split() and d.get("type")=="checkbox":
                          self.choices.append(d)
                      if d.get("id")=="consent" and "required" in d: self.required_consent=True
                      if d.get("name")=="_captcha" and d.get("value")=="true": self.has_captcha=True
                  if tag=="button" and d.get("type")=="submit":
                      self.submit_button=True

          html=Path("atb-feature-checklist/index.html").read_text(encoding="utf-8")
          checker=Check()
          checker.feed(html)
          assert len(checker.form)==1, "Expected one feature form"
          assert checker.form[0].get("method","").upper()=="POST"
          assert checker.form[0].get("action")=="https://formsubmit.co/justlornt95@gmail.com"
          assert len(checker.choices)==24, "Expected 24 opt-in feature checkboxes"
          assert len({c["name"] for c in checker.choices})==24
          assert checker.required_consent and checker.has_captcha and checker.submit_button
          assert "No affiliation with ATB Financial" in html
          print("PASS: 24 features, strict POST destination, consent, CAPTCHA, submit, no affiliation claim")
          print("NOTE: This does not test FormSubmit or email delivery.")
          PY

  remote-page-check:
    name: Verify live GitHub Pages HTTP 200 (no form submission)
    if: github.event_name != 'pull_request'
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Confirm deployed public page from GitHub-hosted network
        shell: bash
        run: |
          set -euo pipefail
          URL="https://lornt1666.github.io/RegenExcalibur-Webpage/atb-feature-checklist/"
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location --connect-timeout 8 --max-time 18 "$URL" -o /tmp/atb-public.html; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::Public GitHub Pages site not verified after bounded retries. Check Pages source settings."
              exit 1
            fi
            sleep 12
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class RemoteForm(HTMLParser):
              def __init__(self):
                  super().__init__(); self.checkbox_count=0; self.post_target=False
              def handle_starttag(self,tag,pairs):
                  d=dict(pairs)
                  if tag=="form" and d.get("method","").upper()=="POST" and d.get("action")=="https://formsubmit.co/justlornt95@gmail.com":
                      self.post_target=True
                  if tag=="input" and "feature-input" in d.get("class","").split():
                      self.checkbox_count+=1
          h=Path("/tmp/atb-public.html").read_text(encoding="utf-8")
          p=RemoteForm();p.feed(h)
          assert p.checkbox_count==24, f"Expected 24 features, got {p.checkbox_count}"
          assert p.post_target, "Public page missing approved form POST target"
          print("PASS: public GitHub Pages responded and rendered the expected form")
          print("NOT CHECKED: FormSubmit activation, CAPTCHA completion or real email delivery")
          PY
